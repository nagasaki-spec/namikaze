<title>波風サーフ予報</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Sticky header with spot name, "now" summary card,
   day tabs over a horizontally scrolling 3-hour matrix (row labels stick left), 7-day wave chart,
   tide-cycle card, fixed bottom nav. Colors encode wind relation to the beach and wave size. */
:root{
  --bg:#edf2f5; --panel:#ffffff; --panel2:#f4f7f9; --fg:#132230; --muted:#5e6d79; --line:#d5dee5;
  --accent:#0b6fb8; --accent-fg:#ffffff; --now:#e0362c;
  --off:#1a9a4f; --soff:#67b63a; --side:#d9b000; --son:#ee8420; --on:#d8392b; --rel-fg:#ffffff;
  --w0:#f2f7fb; --w1:#dcecf9; --w2:#b5d8f3; --w3:#7fbbe9; --w4:#3f93d8; --w5:#1c63b5; --w6:#4a2c96;
  --s0:#f0f3f5; --s1:#dff1dc; --s2:#fdf0b5; --s3:#fdd39b; --s4:#f7a79a; --s5:#d8392b;
  --c0:#1a9a4f; --c1:#2a8fd6; --c2:#d9a300; --c3:#9aa6b0;
  --font:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  --num:"Barlow Condensed","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1a23; --panel:#182631; --panel2:#1f2f3b; --fg:#e8eef3; --muted:#93a3b0; --line:#2c3d4a;
  --accent:#4aa3e8; --accent-fg:#06202f; --now:#ff6a5c;
  --off:#2fbf66; --soff:#8bcf52; --side:#e6c22c; --son:#f0923a; --on:#ef5b4d; --rel-fg:#06202f;
  --w0:#1b2a35; --w1:#1f3a50; --w2:#23507a; --w3:#2a6ca8; --w4:#3a8ad6; --w5:#6aa9ec; --w6:#9d7cf2;
  --s0:#1f2f3b; --s1:#234a30; --s2:#5a4f12; --s3:#6a3f12; --s4:#7a2a22; --s5:#e0493b;
  --c0:#2fbf66; --c1:#4aa3e8; --c2:#e6c22c; --c3:#6f7f8b;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1a23; --panel:#182631; --panel2:#1f2f3b; --fg:#e8eef3; --muted:#93a3b0; --line:#2c3d4a;
  --accent:#4aa3e8; --accent-fg:#06202f; --now:#ff6a5c;
  --off:#2fbf66; --soff:#8bcf52; --side:#e6c22c; --son:#f0923a; --on:#ef5b4d; --rel-fg:#06202f;
  --w0:#1b2a35; --w1:#1f3a50; --w2:#23507a; --w3:#2a6ca8; --w4:#3a8ad6; --w5:#6aa9ec; --w6:#9d7cf2;
  --s0:#1f2f3b; --s1:#234a30; --s2:#5a4f12; --s3:#6a3f12; --s4:#7a2a22; --s5:#e0493b;
  --c0:#2fbf66; --c1:#4aa3e8; --c2:#e6c22c; --c3:#6f7f8b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(76px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.hdr-row{display:flex;align-items:center;gap:8px;min-height:52px}
.brand{font-family:var(--num);font-weight:700;font-size:18px;letter-spacing:.02em;color:var(--accent);white-space:nowrap}
.spotbtn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:var(--panel2);text-align:left}
.spotbtn .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spotbtn .ar{font-size:11px;color:var(--muted);white-space:nowrap}
.spotbtn .chev{margin-left:auto;color:var(--muted);font-size:12px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1}
.icon-btn.fav{color:var(--muted)}
.icon-btn.fav.on{color:#f0b429}
.status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);padding:4px 0 6px;flex-wrap:wrap}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--off)}
.status.sample .dot{background:var(--side)}
.status.err .dot{background:var(--on)}

/* sections */
.view{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.card{background:var(--panel);border-radius:12px;padding:12px 14px;min-width:0}
.card h2{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sub{font-size:11px;color:var(--muted)}

/* now summary */
.now-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.now-head .t{font-weight:700}
.addr{font-size:12px;color:var(--muted);margin-top:2px}
.now-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tile{background:var(--panel2);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;min-width:0}
.tile .lbl{font-size:11px;color:var(--muted)}
.tile .big{font-family:var(--num);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tile .big small{font-size:14px;font-weight:600;margin-left:2px}
.tile .meta{font-size:12px;color:var(--muted);white-space:nowrap}
.tile.full{grid-column:1/-1;justify-content:space-between}
.arw{width:28px;height:28px;flex:none}
.arw path{fill:currentColor}
.rel-chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;color:var(--rel-fg);white-space:nowrap}
.cond{font-family:var(--num);font-weight:700;font-size:34px;line-height:1}
.c0{color:var(--c0)}.c1{color:var(--c1)}.c2{color:var(--c2)}.c3{color:var(--c3)}
.rel0{background:var(--off);color:var(--rel-fg)}.rel1{background:var(--soff);color:var(--rel-fg)}.rel2{background:var(--side);color:var(--rel-fg)}.rel3{background:var(--son);color:var(--rel-fg)}.rel4{background:var(--on);color:var(--rel-fg)}
.fx0{color:var(--off)}.fx1{color:var(--soff)}.fx2{color:var(--side)}.fx3{color:var(--son)}.fx4{color:var(--on)}

/* day tabs */
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -14px;padding-left:14px;padding-right:14px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;padding:6px 10px;border-radius:8px;background:var(--panel2);font-size:12px;line-height:1.2;text-align:center;min-width:56px;border:1px solid transparent}
.day .d{font-family:var(--num);font-weight:700;font-size:15px;display:block}
.day.sel{background:var(--accent);color:var(--accent-fg)}
.day .sat{color:var(--accent)} .day .sun{color:var(--now)} .day.sel .sat,.day.sel .sun{color:inherit}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 6px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel2);border-radius:8px;padding:2px}
.seg button{padding:4px 10px;border-radius:6px;font-size:12px}
.seg button.on{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:700}

/* matrix */
.scroll{overflow-x:auto;margin:0 -14px 0 0;padding:0 14px 0 0;-webkit-overflow-scrolling:touch}
table.mx{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:100%}
.mx th,.mx td{text-align:center;padding:4px 2px;border-bottom:1px solid var(--line);font-weight:500;min-width:50px;white-space:nowrap}
.mx th.lbl,.mx td.lbl{position:sticky;left:0;background:var(--panel);text-align:left;font-size:11px;color:var(--muted);min-width:58px;padding-left:0;z-index:1;font-weight:700;box-shadow:2px 0 0 var(--panel)}
.mx thead th{font-family:var(--num);font-size:14px;font-weight:700;color:var(--fg)}
.mx thead th.lbl{color:var(--muted)}
.mx th.now,.mx td.now{box-shadow:inset 2px 0 0 var(--now), inset -2px 0 0 var(--now)}
.mx thead th.now{color:var(--now)}
.mx .wx{font-size:20px;line-height:1}
.mx .num{font-size:15px;font-weight:600}
.mx .u{font-size:10px;color:var(--muted);font-weight:500}
.mx td .arw{width:22px;height:22px;display:block;margin:0 auto}
.mx .dirn{font-size:10px;display:block;line-height:1.1;margin-top:1px}
.mx td.w0{background:var(--w0)}.mx td.w1{background:var(--w1)}.mx td.w2{background:var(--w2)}.mx td.w3{background:var(--w3)}.mx td.w4{background:var(--w4);color:#fff}.mx td.w5{background:var(--w5);color:#fff}.mx td.w6{background:var(--w6);color:#fff}
.mx td.s0{background:var(--s0)}.mx td.s1{background:var(--s1)}.mx td.s2{background:var(--s2)}.mx td.s3{background:var(--s3)}.mx td.s4{background:var(--s4)}.mx td.s5{background:var(--s5);color:#fff}
.mx td.r0{background:var(--off);color:var(--rel-fg)}.mx td.r1{background:var(--soff);color:var(--rel-fg)}.mx td.r2{background:var(--side);color:var(--rel-fg)}.mx td.r3{background:var(--son);color:var(--rel-fg)}.mx td.r4{background:var(--on);color:var(--rel-fg)}
.mx td.cond{font-family:var(--num);font-size:22px;font-weight:700;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--num);fill:var(--muted);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .area{fill:var(--accent);opacity:.18}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:1.6}
.chart .nowl{stroke:var(--now);stroke-width:1.2;stroke-dasharray:3 2}
.chart .dsep{stroke:var(--line);stroke-width:1}
.chart .wl{fill:none;stroke:var(--son);stroke-width:1.2;opacity:.9}
.chart .dl{fill:var(--fg);font-weight:700;font-size:11px}
.chart .dl.sun{fill:var(--now)} .chart .dl.sat{fill:var(--accent)}

/* tide */
.tide{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tide .nm{font-size:26px;font-weight:700}
.moon{width:44px;height:44px;flex:none}
.tide-ev{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin-left:auto}
.tide-ev span{white-space:nowrap}
.tide-ev .hi b{color:var(--accent)}
.tide-ev .lo b{color:var(--son)}
.tide-ev b{font-size:14px}
.tidec{margin-top:6px}

/* list */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:5px 12px;border-radius:999px;background:var(--panel);font-size:12px;border:1px solid var(--line)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.area-h{font-size:12px;color:var(--muted);font-weight:700;margin:6px 0 4px;letter-spacing:.06em}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:6px;background:var(--panel);border-radius:10px;padding:8px 10px;text-align:left;width:100%}
.row .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sb{font-size:11px;color:var(--muted);display:block}
.row .cell{display:flex;align-items:center;gap:4px;min-width:64px;justify-content:flex-end;position:relative;padding-top:10px}
.row .cell .cl{position:absolute;top:-4px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted);letter-spacing:.05em}
.listkey{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);margin-bottom:8px}
.listkey span{display:inline-flex;align-items:center;gap:4px}
.listkey i{width:10px;height:10px;border-radius:3px;display:inline-block}
.row .cell .v{font-family:var(--num);font-weight:700;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.row .cell .v small{font-size:11px;font-weight:600}
.row .cell .arw{width:22px;height:22px}
.row .cmark{font-family:var(--num);font-weight:700;font-size:24px;line-height:1;width:28px;text-align:center}
.row .cell .v{color:var(--fg)}
.row .star{color:var(--muted);font-size:18px;padding:4px}
.row .star.on{color:#f0b429}
.empty{padding:24px 12px;text-align:center;color:var(--muted)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--panel);border-top:1px solid var(--line);display:flex;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;padding:8px 0 6px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent);font-weight:700}

/* picker */
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,20,30,.5);display:flex;align-items:flex-end}
.sheet{background:var(--panel);width:100%;max-height:85%;border-radius:16px 16px 0 0;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet-h b{font-size:16px}
.sheet .area-h{margin-top:10px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.pick button{padding:8px 10px;border-radius:8px;background:var(--panel2);text-align:left;font-size:13px;font-weight:500;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.pick button .pa{flex-basis:100%;font-size:10px;color:var(--muted);margin-top:2px}
.pick button.sel .pa{color:inherit;opacity:.85}
.pick button.sel{background:var(--accent);color:var(--accent-fg)}
.pick button .fc{font-size:10px;color:var(--muted);white-space:nowrap;flex:none;margin-left:6px}
.pick button.sel .fc{color:inherit}
.note{font-size:11px;color:var(--muted);line-height:1.6}
.note a{color:var(--accent)}
/* live cameras */
.cams{display:flex;flex-wrap:wrap;gap:6px}
.cam{display:inline-block;padding:7px 12px;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-size:13px;font-weight:700;text-decoration:none;max-width:100%;overflow-wrap:anywhere}
.cam.alt{background:var(--panel2);color:var(--fg);font-weight:500;font-size:12px}
/* map */
:root{--land:#e6e1d3;--coast:#8d8572;--sea:#cfd9e2}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--land:#3a3f3a;--coast:#6c7366;--sea:#22303a} }
:root[data-theme="dark"]{--land:#3a3f3a;--coast:#6c7366;--sea:#22303a}
.mapwrap{position:relative;border-radius:10px;overflow:hidden;background:var(--sea);touch-action:manipulation}
.mapwrap canvas{display:block;width:100%;height:auto}
.mapwrap .ov{position:absolute;left:8px;top:8px;background:rgba(20,30,40,.75);color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;pointer-events:none;font-weight:700}
.mapwrap .ov .num{font-size:14px}
.mapwrap .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,30,40,.35);color:#fff;font-weight:700;font-size:13px}
.readout{font-size:12px;color:var(--muted);margin-top:6px;min-height:18px}
.readout b{color:var(--fg)}
.timebar{display:flex;align-items:center;gap:8px;margin-top:8px}
.timebar input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.timebar .tl{font-family:var(--num);font-weight:700;font-size:16px;white-space:nowrap;min-width:92px;text-align:center;font-variant-numeric:tabular-nums}
.timebar .stepb{width:34px;height:34px;border-radius:8px;background:var(--panel2);font-size:16px;display:grid;place-items:center}
.cbar{display:flex;margin-top:8px;border-radius:4px;overflow:hidden;height:10px}
.cbar i{flex:1}
.clabels{display:flex;font-size:10px;color:var(--muted);font-family:var(--num);margin-top:2px}
.clabels span{flex:1;text-align:left}
@media (prefers-reduced-motion:no-preference){ .day,.chip,.row{transition:background .15s} }
@media (min-width:640px){ .now-grid{grid-template-columns:repeat(4,1fr)} .tile.full{grid-column:span 2} }
</style>

<div class="hdr">
  <div class="hdr-row">
    <span class="brand">波風</span>
    <button class="spotbtn" id="spotBtn" aria-label="ポイントを選ぶ">
      <span class="nm" id="hSpot">—</span><span class="ar" id="hArea"></span><span class="chev">▼</span>
    </button>
    <button class="icon-btn fav" id="favBtn" aria-label="お気に入り">★</button>
    <button class="icon-btn" id="refreshBtn" aria-label="更新">⟳</button>
  </div>
  <div class="status" id="status"><span class="dot"></span><span id="statusTxt">読み込み中…</span></div>
</div>

<div id="viewSpot" class="view"></div>
<div id="viewList" class="view" hidden></div>
<div id="viewMap" class="view" hidden>
  <div class="card">
    <div class="chips" id="regionChips"></div>
    <div class="seg" id="mapVar" style="display:flex"><button data-v="wh" class="on" style="flex:1">波高</button><button data-v="wp" style="flex:1">波周期</button><button data-v="ws" style="flex:1">風向・風速</button></div>
    <div class="mapwrap" id="mapWrap" style="margin-top:8px"><canvas id="mapCanvas" aria-label="波風マップ"></canvas><div class="ov" id="mapOv"></div><div class="busy" id="mapBusy" hidden>取得中…</div></div>
    <div class="timebar"><button class="stepb" id="tPrev" aria-label="前の時刻">‹</button><input type="range" id="tSlider" min="0" max="23" value="0" aria-label="時刻"><button class="stepb" id="tNext" aria-label="次の時刻">›</button><span class="tl" id="tLabel">--</span></div>
    <div class="cbar" id="cbar"></div><div class="clabels" id="clabels"></div>
    <div class="readout" id="readout">地図をタップすると、その地点の値を表示します</div>
    <p class="note" id="mapNote" style="margin:8px 0 0"></p>
  </div>
</div>

<div class="nav">
  <button id="navSpot" class="on"><svg viewBox="0 0 24 24"><path d="M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 10c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg>ポイント予報</button>
  <button id="navMap"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg>地図</button>
  <button id="navList"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>全ポイント</button>
</div>

<div id="picker" class="modal" hidden></div>

<script id="coast" type="application/json">__COAST__</script>
<script id="snapshot" type="application/json">__SNAPSHOT__</script>
<script>
(function(){
'use strict';
var MV='wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_direction,swell_wave_period,wind_wave_height,wind_wave_direction';
var WV='wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code,temperature_2m';
/* face = 海岸から沖へ向く方位(度)。オフショア判定に使う */

function chart(hours,ni){var W=360,H=130,L=26,R=26,T=18,B=16;var pw=W-L-R,ph=H-T-B;var n=hours.length;if(n<2)return '';

var TIDE_ST={OD:'小田原',D8:'湘南港',Z1:'油壺',CS:'銚子漁港',ZF:'勝浦',MR:'布良',D3:'大洗',D1:'日立',OM:'御前崎',D6:'下田',I4:'赤羽根',TB:'鳥羽',WY:'和歌山',L7:'甲浦',MG:'宮崎',QF:'博多',NH:'那覇',NK:'中城湾港',SD:'仙台新港',C8:'苫小牧東'};
var tideData={},tideBusy={},tideFail={};
function parseTide(txt){var days={};txt.split('\n').forEach(function(ln){if(ln.length<80)return;var h=[];for(var i=0;i<24;i++)h.push(parseInt(ln.substr(i*3,3),10));
  var d='20'+ln.substr(72,2)+'-'+ln.substr(74,2)+'-'+ln.substr(76,2);
  function ev(seg){var out=[];for(var k=0;k<4;k++){var t=seg.substr(k*7,4),c=seg.substr(k*7+4,3);if(t.trim()==='9999'||t.trim()==='')continue;var hh=parseInt(t.substr(0,2),10),mm=parseInt(t.substr(2,2),10),cm=parseInt(c,10);if(isNaN(hh)||isNaN(mm)||isNaN(cm))continue;out.push([hh*60+mm,cm]);}return out;}
  days[d]={h:h,hi:ev(ln.substr(80,28)),lo:ev(ln.substr(108,28))};});return days;}
function mergeTide(code,days){var t=tideData[code]||(tideData[code]={});Object.keys(days).forEach(function(k){t[k]=days[k];});}
function loadTideSnapshot(){try{var j=JSON.parse(document.getElementById('snapshot').textContent);if(j&&j.tide)Object.keys(j.tide).forEach(function(c){mergeTide(c,j.tide[c]);});}catch(e){}}
loadTideSnapshot();
function ensureTide(code,year){var key=code+'_'+year;if(tideBusy[key]||tideFail[key])return;
  try{var c=ls('wk_tide_'+key);if(c){mergeTide(code,parseTide(c));tideFail[key]='ok';return;}}catch(e){}
  if(typeof fetch!=='function'){tideFail[key]=1;return;}
  tideBusy[key]=true;
  fetch('https://www.data.jma.go.jp/kaiyou/data/db/tide/suisan/txt/'+year+'/'+code+'.txt').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(txt){mergeTide(code,parseTide(txt));try{ls('wk_tide_'+key,txt);}catch(e){}tideBusy[key]=false;tideFail[key]='ok';if(state.view==='spot')renderSpot();})
    .catch(function(){tideBusy[key]=false;tideFail[key]=1;if(state.view==='spot')renderSpot();});}
function tideDay(code,key){var t=tideData[code];return t?t[key]:null;}
function hm(min){return pad(Math.floor(min/60))+':'+pad(min%60);}
function tideCard(sp,dayKey){var code=sp.tide;var html='<div class="card"><h2>潮汐</h2>';
  var p=dayKey.split('-');var noon=new Date(+p[0],+p[1]-1,+p[2],12);var age=moonAge(noon);var tn=tideName(age);
  html+='<div class="tide">'+moonSvg(age)+'<div><div class="nm">'+tn+'</div><div class="sub">'+(+p[1])+'/'+(+p[2])+' 月齢 '+(Math.round(age*10)/10).toFixed(1)+'</div></div>';
  var d=code?tideDay(code,dayKey):null;
  if(!code){html+='</div><p class="note" style="margin:8px 0 0">このポイントの潮汐地点は未設定です。</p></div>';return html;}
  if(!d){ensureTide(code,p[0]);
    html+='</div><p class="note" style="margin:8px 0 0">'+(tideBusy[code+'_'+p[0]]?'気象庁 '+TIDE_ST[code]+' の潮位表を取得中…':'潮位表（'+TIDE_ST[code]+' '+p[0]+'年）を取得できませんでした。<a href="https://www.data.jma.go.jp/kaiyou/db/tide/suisan/index.php" target="_blank" rel="noopener">気象庁 潮位表</a> で確認してください。')+'</p></div>';return html;}
  var next=tideDay(code,nextDayKey(dayKey));var h=d.h.slice();h.push(next?next.h[0]:d.h[23]);
  html+='<div class="tide-ev">'+d.hi.map(function(e){return '<span class="hi">満潮 <b class="num">'+hm(e[0])+'</b> '+e[1]+'cm</span>';}).join('')+d.lo.map(function(e){return '<span class="lo">干潮 <b class="num">'+hm(e[0])+'</b> '+e[1]+'cm</span>';}).join('')+'</div></div>';
  html+=tideChart(h,d,dayKey)+'<p class="note" style="margin:6px 0 0">気象庁 潮位表 '+TIDE_ST[code]+'（潮位表基準面からの高さ）。ポイントから離れた地点の値のため、時刻は数十分ずれることがあります。</p></div>';
  return html;}
function nextDayKey(k){var p=k.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]+1);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function tideChart(h,d,dayKey){var W=360,H=120,L=30,R=10,T=14,B=18,pw=W-L-R,ph=H-T-B;
  var mn=Math.min.apply(null,h),mx=Math.max.apply(null,h);mn=Math.floor((mn-10)/20)*20;mx=Math.ceil((mx+10)/20)*20;if(mx<=mn)mx=mn+20;
  var x=function(min){return L+pw*min/1440;},y=function(v){return T+ph-ph*(v-mn)/(mx-mn);};
  var s='<svg class="chart tidec" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="潮位の推移">';
  for(var v=mn;v<=mx;v+=(mx-mn)>=120?40:20){s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-4)+'" y="'+(y(v)+3.5)+'" text-anchor="end">'+v+'</text>';}
  for(var hr=0;hr<=24;hr+=6){s+='<text x="'+x(hr*60)+'" y="'+(H-4)+'" text-anchor="middle">'+hr+'時</text>';}
  var line='',area='M'+x(0)+' '+y(mn);h.forEach(function(v,i){var X=x(i*60).toFixed(1),Y=y(v).toFixed(1);line+=(i?' L':'M')+X+' '+Y;area+=' L'+X+' '+Y;});area+=' L'+x(1440)+' '+y(mn)+'Z';
  s+='<path class="area" d="'+area+'"/><path class="ln" d="'+line+'"/>';
  d.hi.forEach(function(e){s+='<circle cx="'+x(e[0])+'" cy="'+y(e[1])+'" r="3" fill="var(--accent)"/><text x="'+x(e[0])+'" y="'+(y(e[1])-6)+'" text-anchor="middle" class="dl">'+hm(e[0])+'</text>';});
  d.lo.forEach(function(e){s+='<circle cx="'+x(e[0])+'" cy="'+y(e[1])+'" r="3" fill="var(--son)"/><text x="'+x(e[0])+'" y="'+(y(e[1])+13)+'" text-anchor="middle" class="dl">'+hm(e[0])+'</text>';});
  var now=jstNow();if(isoOf(now).slice(0,10)===dayKey){var m=now.getHours()*60+now.getMinutes();s+='<line class="nowl" x1="'+x(m)+'" x2="'+x(m)+'" y1="'+T+'" y2="'+(T+ph)+'"/>';}
  return s+'</svg>';}

};
function scol(sc,v){if(v==null)return null;var c=sc.stops[0][1];for(var i=0;i<sc.stops.length;i++)if(v>=sc.stops[i][0])c=sc.stops[i][1];return c;}
var mapState={regionId:ls('wk_region')||'kanto',v:'wh',t:-1,data:{},busy:false,tap:null};
if(!REGIONS.some(function(r){return r.id===mapState.regionId;}))mapState.regionId=REGIONS[0].id;
function region(){for(var i=0;i<REGIONS.length;i++)if(REGIONS[i].id===mapState.regionId)return REGIONS[i];return REGIONS[0];}
function gridN(r){return [Math.floor((r.lat[1]-r.lat[0])/r.step+1e-6)+1,Math.floor((r.lon[1]-r.lon[0])/r.step+1e-6)+1];}
function packRegion(r,marine,weather,fetchedAt,source){var n=gridN(r),nt=0,times=[];marine=Array.isArray(marine)?marine:[marine];weather=Array.isArray(weather)?weather:[weather];
  for(var q=0;q<marine.length;q++)if(marine[q]&&marine[q].hourly){times=marine[q].hourly.time;break;}
  nt=times.length;var N=n[0]*n[1];var o={id:r.id,fetchedAt:fetchedAt,source:source,t:times,n:n,wh:[],wd:[],wp:[],ws:[],wdir:[]};
  function put(arr,src,k,mul){for(var t=0;t<nt;t++){var v=src&&src[k]?src[k][t]:null;arr.push(v==null?-1:Math.round(v*mul));}}
  for(var c=0;c<N;c++){var m=marine[c]&&marine[c].hourly,w=weather[c]&&weather[c].hourly;
    put(o.wh,m,'wave_height',10);put(o.wd,m,'wave_direction',1);put(o.wp,m,'wave_period',10);put(o.ws,w,'wind_speed_10m',10);put(o.wdir,w,'wind_direction_10m',1);}
  return o;}
function fetchRegion(r){var n=gridN(r),lats=[],lons=[];for(var i=0;i<n[0];i++)for(var j=0;j<n[1];j++){lats.push((r.lat[0]+i*r.step).toFixed(2));lons.push((r.lon[0]+j*r.step).toFixed(2));}
  var q='latitude='+lats.join(',')+'&longitude='+lons.join(',')+'&timezone=Asia%2FTokyo&forecast_days=3&temporal_resolution=hourly_3';
  var mu='https://marine-api.open-meteo.com/v1/marine?'+q+'&hourly=wave_height,wave_direction,wave_period';
  var wu='https://api.open-meteo.com/v1/forecast?'+q+'&hourly=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms';
  function getJson(u){var ac=typeof AbortController!=='undefined'?new AbortController():null;var tm=setTimeout(function(){if(ac)ac.abort();},30000);
    return fetch(u,ac?{signal:ac.signal}:{}).then(function(x){clearTimeout(tm);if(!x.ok)throw new Error('HTTP '+x.status);return x.json();},function(e){clearTimeout(tm);throw e;});}
  return Promise.all([getJson(mu),getJson(wu)]).then(function(rs){var p=packRegion(r,rs[0],rs[1],new Date().toISOString(),'live');try{ls('wk_map_'+r.id,JSON.stringify(p));}catch(e){}return p;});}
function loadRegionCache(id){try{var j=JSON.parse(ls('wk_map_'+id)||'null');if(j&&j.t&&j.wh){j.source='cache';return j;}}catch(e){}return null;}
function ensureRegion(force){var r=region();var d=mapState.data[r.id]||loadRegionCache(r.id);
  if(d)mapState.data[r.id]=d;
  var fresh=d&&d.source==='live'&&(Date.now()-new Date(d.fetchedAt).getTime()<60*60000);
  if(fresh&&!force)return Promise.resolve(d);
  mapState.busy=true;var b=document.getElementById('mapBusy');if(b){b.hidden=false;b.textContent=d?'最新データを取得中…':'取得中…';}
  return fetchRegion(r).then(function(p){mapState.data[r.id]=p;mapState.busy=false;mapState.err='';if(mapState.regionId===r.id)renderMap();return p;})
    .catch(function(e){mapState.busy=false;mapState.err=(e&&/429/.test(String(e.message)))?'rate':'net';if(mapState.regionId===r.id)renderMap();return d;});}
function mapNowIdx(d){if(!d||!d.t.length)return 0;var n=isoOf(jstNow());for(var i=0;i<d.t.length;i++)if(d.t[i]>=n)return i;return d.t.length-1;}
function tLabel(iso){var p=iso.slice(0,10).split('-');var w=new Date(+p[0],+p[1]-1,+p[2]).getDay();return (+p[1])+'/'+(+p[2])+'('+WD[w]+') '+(+iso.slice(11,13))+'時';}

function renderMap(){var r=region(),d=mapState.data[r.id];
  document.getElementById('regionChips').innerHTML=REGIONS.map(function(x){return '<button class="chip'+(x.id===r.id?' on':'')+'" data-r="'+x.id+'">'+x.name+'</button>';}).join('');
  document.querySelectorAll('#regionChips .chip').forEach(function(b){b.addEventListener('click',function(){mapState.regionId=b.getAttribute('data-r');ls('wk_region',mapState.regionId);mapState.tap=null;renderMap();ensureRegion(false);});});
  document.querySelectorAll('#mapVar button').forEach(function(b){b.className=b.getAttribute('data-v')===mapState.v?'on':'';});
  var sc=SCALES[mapState.v];document.getElementById('cbar').innerHTML=sc.stops.map(function(s){return '<i style="background:'+s[1]+'"></i>';}).join('');
  document.getElementById('clabels').innerHTML=sc.stops.map(function(s){return '<span>'+s[0]+'</span>';}).join('')+'<span style="flex:0;text-align:right">'+sc.unit+'</span>';
  var sl=document.getElementById('tSlider'),busy=document.getElementById('mapBusy');busy.hidden=!mapState.busy;
  var note=document.getElementById('mapNote');
  var errTxt=mapState.err==='rate'?'データ提供元のアクセス制限にかかりました。1分ほど待ってから ⟳ で再取得してください。':mapState.err==='net'?'この地域のデータを取得できませんでした。通信環境を確認して ⟳ で再取得してください。':'';
  if(!d){document.getElementById('tLabel').textContent='--';document.getElementById('mapOv').textContent=r.name;note.textContent=mapState.busy?'':errTxt;drawMap(r,null);return;}
  if(mapState.t<0||mapState.t>=d.t.length)mapState.t=mapNowIdx(d);
  sl.max=d.t.length-1;sl.value=mapState.t;document.getElementById('tLabel').textContent=tLabel(d.t[mapState.t]);
  document.getElementById('mapOv').innerHTML=r.name+' '+sc.name+' <span class="num">'+tLabel(d.t[mapState.t])+'</span>';
  note.textContent=(d.source==='snapshot'?'サンプルデータ（'+fmtAt(d.fetchedAt)+' 取得）。':d.source==='cache'?'前回取得 '+fmtAt(d.fetchedAt)+' のデータ。':'更新 '+fmtAt(d.fetchedAt)+'。')+(mapState.busy?'':errTxt)+' 矢印は波・風の進む向き。陸地に近い格子は沖合の値です。';
  drawMap(r,d);readout(r,d);}

function readout(r,d){var el=document.getElementById('readout');var tp=mapState.tap;if(!tp||!d){el.innerHTML='地図をタップすると、その地点の値を表示します';return;}
  var nt=d.t.length,c=tp.i*d.n[1]+tp.j,k=c*nt+mapState.t;var wh=d.wh[k],wd=d.wd[k],wp=d.wp[k],ws=d.ws[k],wdir=d.wdir[k];
  var lat=(r.lat[0]+tp.i*r.step).toFixed(1),lon=(r.lon[0]+tp.j*r.step).toFixed(1);
  el.innerHTML='N'+lat+' E'+lon+'：波高 <b>'+(wh<0?'--':(wh/10).toFixed(1)+'m')+'</b> '+(wd<0?'':dir16(wd)+'から')+' 周期 <b>'+(wp<0?'--':(wp/10).toFixed(0)+'s')+'</b> ／ 風 <b>'+(ws<0?'--':(ws/10).toFixed(1)+'m/s')+'</b> '+(wdir<0?'':dir16(wdir)+'から');}

function drawMap(r,d){var cv=document.getElementById('mapCanvas');var W=cv.clientWidth||Math.min(600,document.body.clientWidth-60);if(W<50)W=340;
  var n=gridN(r),s=r.step;var lonMin=r.lon[0]-s/2,lonMax=r.lon[0]+(n[1]-1)*s+s/2,latMin=r.lat[0]-s/2,latMax=r.lat[0]+(n[0]-1)*s+s/2;
  var cos=Math.cos((latMin+latMax)/2*Math.PI/180);var H=Math.round(W*(latMax-latMin)/((lonMax-lonMin)*cos));
  var dpr=Math.min(3,window.devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.height=H+'px';
  var ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  var cs=getComputedStyle(document.documentElement);var SEA=cs.getPropertyValue('--sea').trim()||'#cfd9e2',LAND=cs.getPropertyValue('--land').trim()||'#e6e1d3',COASTC=cs.getPropertyValue('--coast').trim()||'#8d8572';
  function px(lon){return (lon-lonMin)/(lonMax-lonMin)*W;}function py(lat){return (latMax-lat)/(latMax-latMin)*H;}
  ctx.fillStyle=SEA;ctx.fillRect(0,0,W,H);
  var sc=SCALES[mapState.v],nt=d?d.t.length:0,t=mapState.t;
  var cw=px(s)-px(0),ch=py(0)-py(s);
  if(d){for(var i=0;i<n[0];i++)for(var j=0;j<n[1];j++){var c=i*n[1]+j,k=c*nt+t;var v=mapState.v==='wh'?d.wh[k]:mapState.v==='wp'?d.wp[k]:d.ws[k];if(v<0)continue;
      var col=scol(sc,v/10);if(!col)continue;ctx.fillStyle=col;var x0=px(r.lon[0]+j*s-s/2),y0=py(r.lat[0]+i*s+s/2);ctx.fillRect(x0,y0,cw+0.6,ch+0.6);}}
  /* land */
  ctx.fillStyle=LAND;ctx.strokeStyle=COASTC;ctx.lineWidth=0.8;ctx.lineJoin='round';
  for(var q=0;q<COAST.length;q++){var ring=COAST[q];var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;for(var p=0;p<ring.length;p+=2){if(ring[p]<minx)minx=ring[p];if(ring[p]>maxx)maxx=ring[p];if(ring[p+1]<miny)miny=ring[p+1];if(ring[p+1]>maxy)maxy=ring[p+1];}
    if(maxx<lonMin||minx>lonMax||maxy<latMin||miny>latMax)continue;
    ctx.beginPath();ctx.moveTo(px(ring[0]),py(ring[1]));for(p=2;p<ring.length;p+=2)ctx.lineTo(px(ring[p]),py(ring[p+1]));ctx.closePath();ctx.fill();ctx.stroke();}
  /* arrows */
  if(d){var L=Math.max(6,Math.min(cw,ch)*0.62),hw=L*0.28;ctx.lineCap='round';
    for(i=0;i<n[0];i++)for(j=0;j<n[1];j++){c=i*n[1]+j;k=c*nt+t;var dir=mapState.v==='ws'?d.wdir[k]:d.wd[k];if(dir<0)continue;
      var cx=px(r.lon[0]+j*s),cy=py(r.lat[0]+i*s);var a=(dir+180)*Math.PI/180;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(a);
      ctx.beginPath();ctx.moveTo(0,L/2);ctx.lineTo(0,-L/2);ctx.moveTo(-hw,-L/2+hw);ctx.lineTo(0,-L/2);ctx.lineTo(hw,-L/2+hw);
      ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2.6;ctx.stroke();ctx.strokeStyle='#111';ctx.lineWidth=1.1;ctx.stroke();ctx.restore();}}
  /* surf spots */
  for(q=0;q<SPOTS.length;q++){var sp=SPOTS[q];if(sp.lon<lonMin||sp.lon>lonMax||sp.lat<latMin||sp.lat>latMax)continue;
    ctx.beginPath();ctx.arc(px(sp.lon),py(sp.lat),3.2,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.beginPath();ctx.arc(px(sp.lon),py(sp.lat),2,0,Math.PI*2);ctx.fillStyle='#d8392b';ctx.fill();}
  /* tapped cell */
  if(d&&mapState.tap){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(px(r.lon[0]+mapState.tap.j*s-s/2),py(r.lat[0]+mapState.tap.i*s+s/2),cw,ch);ctx.strokeStyle='#111';ctx.lineWidth=1;ctx.strokeRect(px(r.lon[0]+mapState.tap.j*s-s/2),py(r.lat[0]+mapState.tap.i*s+s/2),cw,ch);}
  cv._geo={lonMin:lonMin,lonMax:lonMax,latMin:latMin,latMax:latMax,W:W,H:H};}

document.getElementById('mapCanvas').addEventListener('click',function(e){var cv=e.currentTarget,g=cv._geo,r=region();if(!g)return;var rc=cv.getBoundingClientRect();
  var lon=g.lonMin+(e.clientX-rc.left)/rc.width*(g.lonMax-g.lonMin),lat=g.latMax-(e.clientY-rc.top)/rc.height*(g.latMax-g.latMin);var n=gridN(r);
  var j=Math.round((lon-r.lon[0])/r.step),i=Math.round((lat-r.lat[0])/r.step);if(i<0||j<0||i>=n[0]||j>=n[1])return;mapState.tap={i:i,j:j};renderMap();});
document.querySelectorAll('#mapVar button').forEach(function(b){b.addEventListener('click',function(){mapState.v=b.getAttribute('data-v');renderMap();});});
document.getElementById('tSlider').addEventListener('input',function(e){mapState.t=+e.target.value;renderMap();});
document.getElementById('tPrev').addEventListener('click',function(){if(mapState.t>0){mapState.t--;renderMap();}});
document.getElementById('tNext').addEventListener('click',function(){var d=mapState.data[region().id];if(d&&mapState.t<d.t.length-1){mapState.t++;renderMap();}});
var rsz;window.addEventListener('resize',function(){clearTimeout(rsz);rsz=setTimeout(function(){if(state.view==='map')renderMap();},150);});
function loadMapSnapshot(){try{var j=JSON.parse(document.getElementById('snapshot').textContent);if(j&&j.map){Object.keys(j.map).forEach(function(id){var p=j.map[id];p.source='snapshot';p.fetchedAt=j.fetchedAt;mapState.data[id]=p;});}}catch(e){}}
loadMapSnapshot();

function showView(v){state.view=v;document.getElementById('viewSpot').hidden=v!=='spot';document.getElementById('viewList').hidden=v!=='list';document.getElementById('viewMap').hidden=v!=='map';
  document.getElementById('navSpot').className=v==='spot'?'on':'';document.getElementById('navList').className=v==='list'?'on':'';document.getElementById('navMap').className=v==='map'?'on':'';
  if(v==='spot')renderSpot();else if(v==='list')renderList();else{renderMap();ensureRegion(false);}window.scrollTo(0,0);}
function render(){if(state.view==='spot')renderSpot();else if(state.view==='list')renderList();else renderMap();}

document.getElementById('spotBtn').addEventListener('click',openPicker);
document.getElementById('navSpot').addEventListener('click',function(){showView('spot');});
document.getElementById('navList').addEventListener('click',function(){showView('list');});
document.getElementById('navMap').addEventListener('click',function(){showView('map');});
document.getElementById('favBtn').addEventListener('click',function(){var i=state.favs.indexOf(state.spotId);if(i>=0)state.favs.splice(i,1);else state.favs.push(state.spotId);ls('wk_favs',JSON.stringify(state.favs));render();});
document.getElementById('refreshBtn').addEventListener('click',function(){update(true);if(state.view==='map')ensureRegion(true);});

function update(manual){setStatus('','最新データを取得中…');
  return fetchLive().then(function(d){state.data=d;setStatus('','更新 '+fmtAt(d.fetchedAt)+' · Open-Meteo');render();})
    .catch(function(err){var d=state.data;
      if(d&&d.source==='cache')setStatus('err','通信できません。前回取得 '+fmtAt(d.fetchedAt)+' のデータを表示');
      else if(d&&d.source==='snapshot')setStatus('sample','サンプルデータ（'+fmtAt(d.fetchedAt)+' 取得）を表示中。ネット接続後に更新してください');
      else if(d)setStatus('err','通信できません。'+fmtAt(d.fetchedAt)+' のデータを表示');
      else setStatus('err','データを取得できません。通信環境を確認して更新してください');
      if(manual&&!d)render();});}

/* boot: show cached or embedded data at once, then refresh */
state.data=loadCache()||loadSnapshot();
if(state.data){var sel=state.data;var dl0=days(hoursOf());state.dayIdx=dayIndexOf(dl0,nowIdx(hoursOf()));render();}
else document.getElementById('viewSpot').innerHTML='<div class="card empty">読み込み中…</div>';
if(location.hash==='#map')showView('map');else if(location.hash==='#list')showView('list');
update(false);
})();
</script>
